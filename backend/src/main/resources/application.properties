# ===========================================
# Quiz Platform Backend Configuration
# ===========================================

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quiz_platform}
spring.datasource.username=${DATABASE_USERNAME:quiz_user}
spring.datasource.password=${DATABASE_PASSWORD:quiz_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long-for-security}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.quizplatform=DEBUG
logging.level.org.springframework.security=DEBUG
